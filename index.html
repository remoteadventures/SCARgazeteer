<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCAR Gazetteer">
<meta name="theme-color" content="#0a1628">
<title>SCAR Antarctic Gazetteer</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ice: #a8d8ea; --ice-dim: #6ab0cc; --deep: #0a1628;
    --panel: rgba(10,22,40,0.93); --surface: rgba(12,26,48,0.97);
    --border: rgba(168,216,234,0.18); --text: #e8f4f8; --text-dim: #8bb8cc;
    --accent: #4fc3f7; --warn: #ff8a65; --radius: 12px; --panel-w: 360px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Barlow', sans-serif; background: var(--deep); color: var(--text); }
  #map { position: fixed; inset: 0; z-index: 0; }

  /* Leaflet popup override */
  .leaflet-popup-content-wrapper {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content { margin: 12px 14px; font-family: 'Barlow', sans-serif; font-size: 13px; }
  .leaflet-popup-close-button { color: var(--text-dim) !important; font-size: 18px !important; }
  .popup-name { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--ice); margin-bottom: 4px; }
  .popup-ft { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .popup-btn { display: inline-block; margin-top: 8px; background: rgba(79,195,247,0.15); border: 1px solid var(--accent); border-radius: 6px; padding: 5px 12px; color: var(--accent); font-size: 12px; cursor: pointer; }

  /* HEADER */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--panel); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px; display: flex; gap: 10px; align-items: center;
  }
  #header h1 {
    font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 600;
    letter-spacing: 0.06em; color: var(--ice); white-space: nowrap; text-transform: uppercase;
  }
  #search-wrap { flex: 1; position: relative; }
  #search {
    width: 100%; padding: 8px 34px 8px 12px;
    background: rgba(168,216,234,0.08); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: 'Barlow', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus { border-color: var(--accent); }
  #search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 20px; line-height: 1; display: none; padding: 0;
  }
  .hbtn {
    background: rgba(168,216,234,0.1); border: 1px solid var(--border);
    border-radius: 8px; color: var(--ice); cursor: pointer;
    padding: 8px 10px; font-size: 17px; line-height: 1;
    transition: background 0.2s; white-space: nowrap;
  }
  .hbtn:hover { background: rgba(168,216,234,0.2); }

  /* RESULTS PANEL */
  #results-panel {
    position: fixed; top: 58px; left: 0; bottom: 0; z-index: 900;
    width: var(--panel-w); background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.3s ease;
  }
  #results-panel.open { transform: translateX(0); }

  #panel-top {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  #result-count { font-size: 12px; color: var(--text-dim); flex: 1; }

  #radius-wrap {
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    display: none; flex-shrink: 0;
  }
  #radius-wrap.visible { display: block; }
  #radius-label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  #radius-slider { flex: 1; accent-color: var(--accent); }
  #radius-val { font-size: 12px; color: var(--accent); font-weight: 600; min-width: 52px; text-align: right; }

  #ft-wrap { padding: 6px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #ft-select {
    width: 100%; background: rgba(168,216,234,0.08);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'Barlow', sans-serif;
    font-size: 13px; padding: 5px 8px; outline: none;
  }
  #ft-select option { background: #0d1e38; }

  #results-list { flex: 1; overflow-y: auto; }
  #results-list::-webkit-scrollbar { width: 4px; }
  #results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .result-item {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .result-item:hover { background: rgba(168,216,234,0.07); }
  .result-item.active { background: rgba(79,195,247,0.12); border-left: 3px solid var(--accent); padding-left: 11px; }
  .ri-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .ri-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
  .ri-badge { background: rgba(168,216,234,0.1); border-radius: 4px; padding: 1px 6px; font-size: 10px; color: var(--ice-dim); }
  .ri-dist { color: var(--accent); font-size: 11px; font-weight: 600; }

  /* DETAIL */
  #detail {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1100;
    background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    padding: 16px 18px 28px;
    transform: translateY(100%); transition: transform 0.3s ease;
    max-height: 58vh; overflow-y: auto;
  }
  #detail.open { transform: translateY(0); }
  #detail-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; color: var(--text-dim);
    font-size: 24px; cursor: pointer; line-height: 1;
  }
  #detail h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: var(--ice); margin-bottom: 8px; padding-right: 32px; }
  #detail-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .badge { background: rgba(168,216,234,0.1); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 11px; color: var(--ice-dim); }
  #detail-desc { font-size: 13px; line-height: 1.75; color: var(--text-dim); margin-bottom: 8px; }
  #detail-named { font-size: 12px; color: var(--text-dim); font-style: italic; margin-bottom: 4px; }
  #detail-coords { font-size: 11px; color: rgba(168,216,234,0.35); font-family: monospace; margin-top: 6px; }
  #detail-osm { display: inline-block; margin-top: 12px; background: rgba(79,195,247,0.12); border: 1px solid var(--accent); border-radius: 8px; padding: 7px 14px; color: var(--accent); font-size: 13px; text-decoration: none; }

  /* CLOSEST BUTTON */
  #btn-closest {
    position: fixed; bottom: 24px; right: 16px; z-index: 950;
    background: var(--accent); color: var(--deep);
    border: none; border-radius: 50px;
    padding: 12px 18px; font-family: 'Barlow', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 20px rgba(79,195,247,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  #btn-closest:hover { transform: scale(1.04); box-shadow: 0 6px 28px rgba(79,195,247,0.5); }

  /* TOAST */
  #toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(10,22,40,0.95); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 16px;
    font-size: 13px; color: var(--text-dim);
    z-index: 9999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* LOADING */
  #loading {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--deep);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  #loading h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; color: var(--ice); letter-spacing: 0.1em; }
  #loading p { font-size: 13px; color: var(--text-dim); }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(168,216,234,0.15); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }


  /* OFFLINE BANNER */
  #offline-banner {
    position: fixed; top: 58px; left: 0; right: 0; z-index: 800;
    background: rgba(255,138,101,0.15); border-bottom: 1px solid rgba(255,138,101,0.3);
    padding: 6px 14px; font-size: 12px; color: #ff8a65;
    text-align: center; display: none;
  }
  #offline-banner.show { display: block; }
  /* push panel down when banner visible */
  #results-panel.offset { top: 82px; }

  @media (max-width: 600px) {
    :root { --panel-w: 100vw; }
    #header h1 { display: none; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>SCAR GAZETTEER</h2>
  <p>Loading 40,127 Antarctic place names…</p>
</div>

<div id="map"></div>

<div id="header">
  <h1>SCAR Gazetteer</h1>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search place names…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="search-clear">×</button>
  </div>
  <button class="hbtn" id="btn-panel" title="Results list">☰</button>
  <button class="hbtn" id="btn-locate" title="My location">⊕</button>
</div>

<div id="results-panel">
  <div id="panel-top">
    <span id="result-count">Loading…</span>
  </div>
  <div id="radius-wrap">
    <div id="radius-label">
      Radius: <input id="radius-slider" type="range" min="10" max="500" value="50" step="10">
      <span id="radius-val">50 km</span>
    </div>
  </div>
  <div id="ft-wrap">
    <select id="ft-select"><option value="">All feature types</option></select>
  </div>
  <div id="results-list"></div>
</div>

<div id="detail">
  <button id="detail-close">×</button>
  <h2 id="detail-name"></h2>
  <div id="detail-badges"></div>
  <p id="detail-desc"></p>
  <p id="detail-named"></p>
  <p id="detail-coords"></p>
  <a id="detail-osm" target="_blank">Open in OpenStreetMap ↗</a>
</div>

<button id="btn-closest">⊙ Closest to me</button>
<div id="toast"></div>
<div id="offline-banner">⚡ Offline mode — using cached data. Map tiles may be limited.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="scar_data.js"></script>
<script>
'use strict';

// ── STATE ────────────────────────────────────────────
let map, allLocations = [], filtered = [];
let userPos = null, userMarker = null;
let radiusMode = false, radiusKm = 50;
let selectedFt = '', searchQ = '';
let layerGroup;

// ── UTILS ────────────────────────────────────────────
function haversine(la1,lo1,la2,lo2){
  const R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

let _toastTimer;
function toast(msg,dur=2800){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),dur);
}

// ── INIT MAP ─────────────────────────────────────────
function initMap(){
  map = L.map('map',{
    center:[-66,110], zoom:5,
    zoomControl:true, attributionControl:true
  });

  // Esri World Imagery (satellite) — no key needed
  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Tiles © Esri', maxZoom:18 }
  );

  // Esri World Topo for terrain option
  const topo = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Tiles © Esri', maxZoom:18 }
  );

  // OpenStreetMap fallback
  const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'© OpenStreetMap contributors', maxZoom:19 }
  );

  satellite.addTo(map);
  L.control.layers(
    {'Satellite':satellite,'Terrain / Topo':topo,'Street map':osm},
    {},{position:'topright'}
  ).addTo(map);

  layerGroup = L.layerGroup().addTo(map);

  map.on('click', ()=> document.getElementById('detail').classList.remove('open'));
}

// ── DATA READY ───────────────────────────────────────
function onDataReady(){
  allLocations = D.map(r=>({
    n:r.n, la:r.la, lo:r.lo,
    al:r.al||'', d:r.d||'',
    na:r.na||'', cc:r.cc||'',
    ft:r.ft||'', dn:r.dn||'',
    _dist:null
  }));
  document.getElementById('loading').style.display='none';
  initFtSelect();
  applyFilters();
  openPanel();
  toast(`${allLocations.length.toLocaleString()} Antarctic place names loaded`);
}

function waitForData(){
  if(typeof D!=='undefined') onDataReady();
  else setTimeout(waitForData,100);
}

// ── FEATURE TYPE SELECT ──────────────────────────────
function initFtSelect(){
  const fts=[...new Set(allLocations.map(l=>l.ft).filter(Boolean))].sort();
  const sel=document.getElementById('ft-select');
  fts.forEach(ft=>{
    const o=document.createElement('option');
    o.value=ft; o.textContent=ft; sel.appendChild(o);
  });
  sel.addEventListener('change',()=>{ selectedFt=sel.value; applyFilters(); });
}

// ── FILTERS ──────────────────────────────────────────
function applyFilters(){
  const q=searchQ.toLowerCase();
  filtered=allLocations.filter(l=>{
    if(selectedFt && l.ft!==selectedFt) return false;
    if(q && !l.n.toLowerCase().includes(q) && !l.d.toLowerCase().includes(q)) return false;
    if(radiusMode && userPos){
      l._dist=haversine(userPos.lat,userPos.lng,l.la,l.lo);
      if(l._dist>radiusKm) return false;
    } else { l._dist=null; }
    return true;
  });
  if(radiusMode && userPos) filtered.sort((a,b)=>a._dist-b._dist);

  document.getElementById('result-count').textContent=
    `${filtered.length.toLocaleString()} of ${allLocations.length.toLocaleString()} places`;

  renderList();
  updateMarkers();
}

// ── LIST ─────────────────────────────────────────────
function renderList(){
  const list=document.getElementById('results-list');
  list.innerHTML='';
  const show=filtered.slice(0,200);
  show.forEach(loc=>{
    const div=document.createElement('div');
    div.className='result-item';
    div.innerHTML=`
      <div class="ri-name">${loc.n}</div>
      <div class="ri-meta">
        ${loc.ft?`<span class="ri-badge">${loc.ft}</span>`:''}
        ${loc.cc?`<span class="ri-badge">${loc.cc}</span>`:''}
        ${loc._dist!=null?`<span class="ri-dist">${loc._dist.toFixed(1)} km</span>`:''}
      </div>`;
    div.addEventListener('click',()=>focusLocation(loc));
    list.appendChild(div);
  });
  if(filtered.length>200){
    const note=document.createElement('div');
    note.style.cssText='padding:10px 14px;font-size:12px;color:var(--text-dim);text-align:center;';
    note.textContent=`Showing 200 of ${filtered.length.toLocaleString()} — refine your search`;
    list.appendChild(note);
  }
}

// ── MARKERS ──────────────────────────────────────────
const dotIcon = L.divIcon({
  className:'',
  html:`<div style="width:8px;height:8px;border-radius:50%;background:#4fc3f7;border:1.5px solid rgba(10,22,40,0.8);box-shadow:0 0 4px rgba(79,195,247,0.6)"></div>`,
  iconSize:[8,8], iconAnchor:[4,4]
});

function updateMarkers(){
  layerGroup.clearLayers();
  // Show up to 3000 markers (Leaflet handles this fine)
  const show=filtered.slice(0,3000);
  show.forEach(loc=>{
    const m=L.marker([loc.la,loc.lo],{icon:dotIcon});
    m.on('click',()=>focusLocation(loc));
    m.bindTooltip(loc.n,{direction:'top',offset:[0,-4],opacity:0.92});
    layerGroup.addLayer(m);
  });
}

// ── FOCUS ────────────────────────────────────────────
function focusLocation(loc){
  map.setView([loc.la,loc.lo], Math.max(map.getZoom(),8), {animate:true});
  showDetail(loc);
  document.querySelectorAll('.result-item').forEach(el=>{
    el.classList.toggle('active', el.querySelector('.ri-name')?.textContent===loc.n);
  });
}

// ── DETAIL ───────────────────────────────────────────
function showDetail(loc){
  document.getElementById('detail-name').textContent=loc.n;
  const badges=[];
  if(loc.ft) badges.push(loc.ft);
  if(loc.cc) badges.push(loc.cc);
  if(loc.al) badges.push(`${loc.al}m`);
  if(loc.dn) badges.push(`Named ${loc.dn}`);
  document.getElementById('detail-badges').innerHTML=
    badges.map(b=>`<span class="badge">${b}</span>`).join('');
  document.getElementById('detail-desc').textContent=loc.d||'No description available.';
  document.getElementById('detail-named').textContent=loc.na?`Named after: ${loc.na}`:'';
  document.getElementById('detail-coords').textContent=`${loc.la.toFixed(5)}°, ${loc.lo.toFixed(5)}°`;
  document.getElementById('detail-osm').href=
    `https://www.openstreetmap.org/?mlat=${loc.la}&mlon=${loc.lo}#map=10/${loc.la}/${loc.lo}`;
  document.getElementById('detail').classList.add('open');
}

// ── PANEL ────────────────────────────────────────────
function openPanel(){ document.getElementById('results-panel').classList.add('open'); }
document.getElementById('btn-panel').addEventListener('click',()=>{
  document.getElementById('results-panel').classList.toggle('open');
});

// ── GEOLOCATION ──────────────────────────────────────
function locateMe(cb){
  if(!navigator.geolocation){ toast('Geolocation not supported'); return; }
  toast('Finding your location…',3000);
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(userMarker) map.removeLayer(userMarker);
    userMarker=L.circleMarker([userPos.lat,userPos.lng],{
      radius:9, fillColor:'#ff8a65', fillOpacity:1,
      color:'#fff', weight:2
    }).addTo(map).bindTooltip('You are here',{permanent:false});
    if(cb) cb();
    else { map.setView([userPos.lat,userPos.lng],7); toast('Location found'); }
  },()=>toast('Could not get location'));
}

document.getElementById('btn-locate').addEventListener('click',()=>locateMe());

// ── CLOSEST TO ME ────────────────────────────────────
document.getElementById('btn-closest').addEventListener('click',()=>{
  locateMe(()=>{
    radiusMode=true;
    document.getElementById('radius-wrap').classList.add('visible');
    applyFilters();
    openPanel();
    if(filtered.length>0){
      const n=filtered[0];
      map.setView([n.la,n.lo],8);
      toast(`Nearest: ${n.n} (${n._dist.toFixed(1)} km)`);
      setTimeout(()=>showDetail(n),400);
    } else {
      toast('No locations found within radius');
    }
  });
});

// ── RADIUS SLIDER ────────────────────────────────────
document.getElementById('radius-slider').addEventListener('input',function(){
  radiusKm=parseInt(this.value);
  document.getElementById('radius-val').textContent=`${radiusKm} km`;
  applyFilters();
});

// ── SEARCH ───────────────────────────────────────────
const searchEl=document.getElementById('search');
const clearBtn=document.getElementById('search-clear');
let searchTimer;
searchEl.addEventListener('input',()=>{
  searchQ=searchEl.value.trim();
  clearBtn.style.display=searchQ?'block':'none';
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    radiusMode=false;
    document.getElementById('radius-wrap').classList.remove('visible');
    applyFilters();
    if(searchQ) openPanel();
  },280);
});
clearBtn.addEventListener('click',()=>{
  searchEl.value=''; searchQ='';
  clearBtn.style.display='none';
  applyFilters();
});

// ── DETAIL CLOSE ─────────────────────────────────────
document.getElementById('detail-close').addEventListener('click',()=>{
  document.getElementById('detail').classList.remove('open');
});

// ── START ─────────────────────────────────────────────
initMap();
waitForData();
</script>

<script>
// Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW failed:', err));
  });
}

// Offline/online detection
function updateOnlineStatus() {
  const banner = document.getElementById('offline-banner');
  const panel = document.getElementById('results-panel');
  if (!navigator.onLine) {
    banner.classList.add('show');
    panel.classList.add('offset');
  } else {
    banner.classList.remove('show');
    panel.classList.remove('offset');
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
</script>

</body>
</html>
